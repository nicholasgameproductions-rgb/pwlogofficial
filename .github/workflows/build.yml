name: Build PwLog
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile JAR
        run: gradle clean jar --no-daemon
      - name: Verify JAR contents
        run: |
          jar tf build/libs/PwLog.jar
          jar tf build/libs/PwLog.jar | grep -Fx 'plugin.yml'
          jar tf build/libs/PwLog.jar | grep -Fx 'com/example/pwlogger/PwLog.class'
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: PwLog
          path: build/libs/PwLog.jar
